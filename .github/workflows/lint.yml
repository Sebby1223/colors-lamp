name: Lint Code

on:
  push:
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint HTML
        run: npx --yes htmlhint "public/**/*.html"

      - name: Lint CSS
        run: npx --yes stylelint "public/**/*.css"

      - name: Lint JavaScript
        run: npx --yes eslint@8 "public/**/*.js"

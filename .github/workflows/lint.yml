name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run linters
        run: |
          if [ -f .eslintrc.json ] || [ -f .eslintrc.js ]; then
            npx eslint . || true
          fi
          if [ -f .htmlhintrc ]; then
            npx htmlhint "public/**/*.html" || true
          fi
          if [ -f .stylelintrc.json ]; then
            npx stylelint "public/**/*.css" || true
          fi

      - name: Run Jest tests
        run: npm test
